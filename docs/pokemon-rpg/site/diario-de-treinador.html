<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diário de Treinador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F3F5; --surface-3:#E9ECEF;
    --ink:#202122; --ink-dim:#54595D; --line:#C8CCD1;
    --accent:#2A5DB0; --accent-ink:#FFFFFF; --accent-soft:#DCE7F7;
    --teal:#0B6E4F; --teal-soft:#DCF3E7;
    --danger:#B32424; --danger-soft:#FBE1E1;
    --good:#0B6E4F;
    --shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101418; --surface:#171B1F; --surface-2:#1D2226; --surface-3:#242A2F;
      --ink:#E6E8EA; --ink-dim:#9AA0A6; --line:#2E3439;
      --accent:#6FA8FF; --accent-ink:#0B1220; --accent-soft:#1B2A40;
      --teal:#4CC38A; --teal-soft:#123425;
      --danger:#FF6B6B; --danger-soft:#3A1414;
      --good:#4CC38A;
      --shadow: 0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101418; --surface:#171B1F; --surface-2:#1D2226; --surface-3:#242A2F;
    --ink:#E6E8EA; --ink-dim:#9AA0A6; --line:#2E3439;
    --accent:#6FA8FF; --accent-ink:#0B1220; --accent-soft:#1B2A40;
    --teal:#4CC38A; --teal-soft:#123425;
    --danger:#FF6B6B; --danger-soft:#3A1414;
    --good:#4CC38A;
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Roboto", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; }
  h1,h2,h3{ font-family:"Roboto", "Segoe UI", system-ui, sans-serif; font-weight:700; text-wrap:balance; margin:0; }
  .num, .stat-table td.num, input[type=number], .mono{
    font-family:"Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  .num, .stat-table td, .stat-table th, input[type=number], input[type=range]+.rangeval{
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  #app{ min-height:100vh; }
  .shell{ max-width:960px; margin:0 auto; padding:0 18px 80px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:16px 2px 14px; border-bottom:3px solid var(--accent); margin-bottom:22px;
    flex-wrap:wrap;
  }
  .topbar .wordmark{ display:flex; align-items:baseline; gap:10px; }
  .topbar h1{ font-size:1.15rem; font-weight:700; }
  .topbar .sub{ font-size:.78rem; color:var(--ink-dim); }
  .topbar .who{ font-size:.78rem; color:var(--ink-dim); display:flex; align-items:center; gap:10px; }
  .topbar .who b{ color:var(--ink); font-weight:600; }

  .banner{
    padding:10px 14px; border-radius:2px; margin-bottom:16px; font-size:.85rem;
    border:1px solid var(--line);
  }
  .banner.error{ background:var(--danger-soft); border-color:var(--danger); color:var(--ink); }
  .banner.notice{ background:var(--teal-soft); border-color:var(--teal); color:var(--ink); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:2px;
    margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-2);
  }
  .card-head .index{ font-size:.66rem; letter-spacing:.06em; color:var(--ink-dim); text-transform:uppercase; font-weight:700; }
  .card-head h2{ font-size:.95rem; font-weight:700; }
  .card-body{ padding:16px; }
  .card-body.tight{ padding:10px 16px; }

  .center-stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:66vh; text-align:center; gap:22px; padding:20px; }
  .center-stage h1{ font-size:1.4rem; }
  .center-stage .lede{ color:var(--ink-dim); max-width:42ch; font-size:.92rem; line-height:1.5; }
  .choice-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .choice-card{
    width:220px; padding:20px 16px; border:1px solid var(--line); border-radius:2px;
    background:var(--surface); cursor:pointer; text-align:left;
  }
  .choice-card:hover{ border-color:var(--accent); }
  .choice-card .glyph{ font-size:1.4rem; }
  .choice-card h3{ font-size:.95rem; margin-top:8px; }
  .choice-card p{ font-size:.78rem; color:var(--ink-dim); margin:6px 0 0; line-height:1.4; }

  form.stack{ display:flex; flex-direction:column; gap:12px; max-width:340px; margin:0 auto; }
  .field{ display:flex; flex-direction:column; gap:5px; text-align:left; }
  .field label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); font-weight:600; }
  input[type=text], input[type=password], input[type=number], select, textarea{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:2px; font-size:.88rem; font-family:inherit; width:100%;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .pip:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  textarea{ resize:vertical; min-height:52px; }

  button{ font-family:"Roboto", "Segoe UI", system-ui, sans-serif; cursor:pointer; border-radius:2px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; font-size:.82rem; font-weight:600; }
  button:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-dim); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--line); }
  .btn-danger{ color:var(--danger); border-color:var(--danger-soft); }
  .btn-danger:hover{ border-color:var(--danger); }
  .btn-sm{ padding:5px 10px; font-size:.74rem; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .muted{ color:var(--ink-dim); font-size:.8rem; }
  .link-btn{ background:none; border:none; color:var(--accent); text-decoration:underline; padding:0; font-size:.8rem; font-weight:600; }
  code.mono{ background:var(--surface-3); padding:1px 5px; border-radius:2px; }

  .attr-grid{ display:flex; flex-direction:column; gap:8px; }
  .attr-row{ display:grid; grid-template-columns: 108px 1fr 28px; align-items:center; gap:10px; }
  .attr-row .label{ font-size:.78rem; font-weight:600; }
  .attr-row .pips{ display:flex; gap:5px; }
  .pip{ width:22px; height:22px; border-radius:2px; border:1px solid var(--line); background:var(--surface); padding:0; font-size:.65rem; color:transparent; }
  .pip.filled{ background:var(--accent); border-color:var(--accent); }
  .attr-row .val{ text-align:right; font-size:.85rem; font-weight:700; color:var(--accent); }
  .budget{ font-size:.76rem; color:var(--ink-dim); margin-top:2px; }
  .budget.over{ color:var(--danger); font-weight:700; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:560px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700; letter-spacing:.02em; padding:3px 8px; border-radius:2px; border:1px solid var(--line); }
  .badge.on{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal); }
  .badge.off{ color:var(--ink-dim); }
  .badge.gm{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .badge.status-bad{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }

  .tag{ display:inline-block; font-size:.68rem; font-weight:600; padding:2px 7px; border-radius:2px; background:var(--surface-3); color:var(--ink-dim); border:1px solid var(--line); }
  .type-badge{ display:inline-block; font-size:.66rem; font-weight:700; letter-spacing:.02em; padding:2px 8px; border-radius:2px; text-transform:uppercase; }

  .trainer-summary{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; padding:12px 14px; }
  .trainer-summary .name{ font-weight:700; font-size:.92rem; }
  .trainer-summary .meta{ font-size:.75rem; color:var(--ink-dim); }
  .trainer-summary .left{ display:flex; flex-direction:column; gap:2px; }
  .trainer-summary .right{ display:flex; align-items:center; gap:8px; }

  .poke-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px){ .poke-grid{ grid-template-columns:1fr; } }
  .poke-card{ border:1px solid var(--line); border-radius:2px; background:var(--surface); }
  .poke-head{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); }
  .poke-head .nick{ font-weight:700; font-size:.88rem; }
  .poke-head .species{ font-size:.72rem; color:var(--ink-dim); }
  .poke-body{ padding:12px; display:flex; flex-direction:column; gap:10px; }
  .poke-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:26px 12px; border:1px dashed var(--line); border-radius:2px; color:var(--ink-dim); font-size:.8rem; }

  /* ---- Arrastar Pokémon entre Equipe e Banco ---- */
  .poke-slot{ position:relative; }
  .poke-slot.poke-slot-empty{ min-height:64px; }
  .poke-slot.drop-hover .poke-card,
  .poke-slot.drop-hover .poke-empty{ outline:2px solid var(--accent); outline-offset:-2px; background:var(--accent-soft); }
  .drag-handle{
    position:absolute; top:6px; right:6px; z-index:2;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:2px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-dim); font-size:.9rem; line-height:1; cursor:grab;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .drag-handle:hover{ color:var(--ink); border-color:var(--accent); }
  .drag-ghost{
    position:fixed; top:0; left:0; z-index:9999; pointer-events:none;
    background:var(--accent); color:var(--accent-ink); font-size:.76rem; font-weight:700;
    padding:6px 10px; border-radius:2px; box-shadow:0 2px 8px rgba(0,0,0,.3);
    transform:translate(-50%,-120%); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .banco-toggle{ display:flex; align-items:center; gap:6px; }
  @keyframes dt-slide-down{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  .banco-drawer{ animation:dt-slide-down .15s ease-out; margin-top:10px; }

  table.stat-table{ width:100%; border-collapse:collapse; font-size:.78rem; }
  table.stat-table th{ text-align:right; font-weight:700; color:var(--ink-dim); padding:4px 6px; font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; background:var(--surface-2); border:1px solid var(--line); }
  table.stat-table th:first-child{ text-align:left; }
  table.stat-table td{ text-align:right; padding:4px 6px; border:1px solid var(--line); }
  table.stat-table td:first-child{ text-align:left; font-weight:600; }
  table.stat-table td.eff{ color:var(--accent); font-weight:700; }
  table.stat-table tbody tr:nth-child(even){ background:var(--surface-2); }
  .stat-bar-cell{ width:90px; }
  .stat-bar-track{ height:8px; background:var(--surface-3); border-radius:1px; overflow:hidden; }
  .stat-bar-fill{ display:block; height:100%; }
  .table-scroll{ overflow-x:auto; }

  .hp-row{ display:flex; align-items:center; gap:10px; }
  .hp-row input[type=number]{ width:70px; }
  .hp-bar{ flex:1; height:8px; background:var(--surface-3); border-radius:1px; overflow:hidden; border:1px solid var(--line); }
  .hp-bar > i{ display:block; height:100%; background:var(--good); }
  .hp-bar.low > i{ background:var(--danger); }

  .moves-list{ display:flex; flex-direction:column; gap:6px; }
  .move-row{ display:grid; grid-template-columns: 1.3fr .8fr .8fr .5fr .5fr; gap:6px; align-items:center; font-size:.76rem; margin-bottom:4px; }
  .move-row.move-row2{ grid-template-columns: 1fr 1.6fr; margin-bottom:10px; }
  .move-row input, .move-row select{ padding:5px 6px; font-size:.76rem; }
  .move-labels{ display:grid; grid-template-columns: 1.3fr .8fr .8fr .5fr .5fr; gap:6px; font-size:.65rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; padding:0 1px; }
  @media (max-width:640px){ .move-row, .move-labels{ grid-template-columns:1fr 1fr; } .move-row.move-row2{ grid-template-columns:1fr; } }

  .stage-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (max-width:640px){ .stage-grid{ grid-template-columns:repeat(3,1fr); } }
  .stage-field label{ font-size:.62rem; }
  .stage-field input{ padding:5px 6px; text-align:center; }

  hr.rule{ border:none; border-top:1px solid var(--line); margin:4px 0; }

  .readonly-note{ font-size:.72rem; color:var(--ink-dim); font-style:italic; }

  footer.legal{ text-align:center; color:var(--ink-dim); font-size:.7rem; margin-top:30px; line-height:1.6; }

  .setup-box{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:18px 20px; max-width:560px; margin:0 auto; }
  .setup-box ol{ padding-left:20px; line-height:1.7; font-size:.88rem; }
  .setup-box pre{ background:var(--surface-3); padding:10px; border-radius:2px; overflow-x:auto; font-size:.76rem; }
</style>
</head>

/* Tabela 6.1: Base Stat oficial -> Atributo Natural RPG (1-20) */
function baseStatToRPG(n){
  n = Number(n)||0;
  if(n>=240) return 20;
  if(n>=220) return 19;
  if(n>=200) return 18;
  if(n>=180) return 17;
  if(n>=165) return 16;
  if(n>=150) return 15;
  if(n>=140) return 14;
  if(n>=130) return 13;
  if(n>=120) return 12;
  if(n>=110) return 11;
  if(n>=100) return 10;
  if(n>=90) return 9;
  if(n>=80) return 8;
  if(n>=70) return 7;
  if(n>=60) return 6;
  if(n>=50) return 5;
  if(n>=40) return 4;
  if(n>=30) return 3;
  if(n>=20) return 2;
  return 1;
}
function findSpeciesByName(name){
  name = (name||"").trim().toLowerCase();
  if(!name) return null;
  for(var i=0;i<SPECIES_DEX.length;i++){
    if(SPECIES_DEX[i].name.toLowerCase()===name) return SPECIES_DEX[i];
  }
  return null;
}

function findMoveByName(name){
  name = (name||"").trim().toLowerCase();
  if(!name) return null;
  for(var i=0;i<MOVES_DEX.length;i++){
    if(MOVES_DEX[i].name.toLowerCase()===name) return MOVES_DEX[i];
  }
  return null;
}
function moveDatalist(id){
  return '<datalist id="'+id+'">'+MOVES_DEX.map(function(m){ return '<option value="'+esc(m.name)+'">'; }).join('')+'</datalist>';
}

/* =================== HELPERS =================== */
function uid(){ return Math.random().toString(36).slice(2,10); }
function clampInt(n,min,max){ n=parseInt(n,10); if(isNaN(n)) n=min; return Math.max(min,Math.min(max,n)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function findTrainer(id){ for(var i=0;i<STATE.trainers.length;i++){ if(STATE.trainers[i].id===id) return STATE.trainers[i]; } return null; }
function byNameCI(name){ name=(name||"").trim().toLowerCase(); for(var i=0;i<STATE.trainers.length;i++){ if(STATE.trainers[i].name.trim().toLowerCase()===name) return STATE.trainers[i]; } return null; }

function newTrainer(name, pin){
  return {
    id: uid(), name: name.trim(), pin: String(pin), shareEnabled:false, level:1,
    battlesWon:0,
    attrPoints:{vigor:0,vontade:0,resistencia:0,mental:0,foco:0,agilidade:0},
    pokemons:[], banco:[]
  };
}
/* Garante que fichas salvas antes do Banco existir ganhem o campo (sem apagar nada). */
function migrateState(){
  (STATE.trainers||[]).forEach(function(t){
    if(!Array.isArray(t.pokemons)) t.pokemons = [];
    if(!Array.isArray(t.banco)) t.banco = [];
  });
}
function newPokemon(){
  return {
    id: uid(), apelido:"", especie:"", tipo1:"", tipo2:"",
    natural:{hp:1,atk:1,def:1,spa:1,spd:1,spe:1},
    vinculo:0, maturidade:0, currentHP:null,
    status:"", statusTurns:0, confuso:false,
    estagios:{atk:0,def:0,spa:0,spd:0,spe:0,precisao:0,evasao:0},
    moves:[{nome:"",tipo:"",categoria:"Físico",poder:0,precisao:"",prioridade:0,efeito:""},
           {nome:"",tipo:"",categoria:"Físico",poder:0,precisao:"",prioridade:0,efeito:""},
           {nome:"",tipo:"",categoria:"Físico",poder:0,precisao:"",prioridade:0,efeito:""},

/* ---- regras: Vínculo, Efetivos, PV ---- */
function liberatedTier(vinculo){
  vinculo = clampInt(vinculo,0,25);
  if(vinculo>=25) return 5;
  if(vinculo>=20) return 4;
  if(vinculo>=15) return 3;
  if(vinculo>=10) return 2;
  if(vinculo>=5) return 1;
  return 0;
}
function attrKeyForStat(stat){ for(var k in ATTR_TO_STAT){ if(ATTR_TO_STAT[k]===stat) return k; } return null; }
function liberatedForStat(trainer, poke, stat){
  var attrKey = attrKeyForStat(stat);
  var trainerAttr = (trainer.attrPoints[attrKey])||0;
  return Math.min(liberatedTier(poke.vinculo), trainerAttr);
}
function effectiveHPStat(trainer, poke){ return (poke.natural.hp||0) + liberatedForStat(trainer, poke, 'hp'); }
function hpMax(trainer, poke){ return 10 + effectiveHPStat(trainer, poke)*3; }
function effectiveStat(trainer, poke, stat){
  var base = (poke.natural[stat]||0) + liberatedForStat(trainer, poke, stat);
  if(stat==='hp') return base;
  var stage = (poke.estagios && poke.estagios[stat]) || 0;
  return base + stage;
}
function attrBudget(level){ return clampInt(level,1,16); }
function attrSpent(trainer){ var s=0; ATTR_ORDER.forEach(function(k){ s += trainer.attrPoints[k]||0; }); return s; }

/* =================== PERSISTÊNCIA (Firestore, em tempo real) =================== */
var saveTimer = null;
var saveInFlight = false;
var saveQueuedAfter = false;

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 400);
}
function doSave(){
  if(!stateDocRef) return;
  if(saveInFlight){ saveQueuedAfter = true; return; }
  saveInFlight = true;
  stateDocRef.set(STATE).catch(function(e){
    SESSION.error = 'Não consegui salvar no banco de dados (verifique sua internet). Sua alteração pode não ter sido salva — tente de novo.';
    render();
  }).then(function(){
    saveInFlight = false;
    if(saveQueuedAfter){ saveQueuedAfter = false; doSave(); }
  });
}
function mutate(){ render(); queueSave(); }

function bootFirebase(){
  if(!FIREBASE_CONFIGURED){ render(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    stateDocRef = db.collection('diario').doc('estado');
    stateDocRef.onSnapshot(function(doc){
      if(doc.exists){
        STATE = doc.data();
      } else {
        stateDocRef.set(STATE);
      }
      migrateState();
      firestoreReady = true;
      render();
    }, function(err){
      SESSION.error = 'Não consegui conectar ao banco de dados. Verifique sua internet e recarregue a página. (' + (err && err.message ? err.message : 'erro desconhecido') + ')';
      render();
    });
  }catch(e){
    SESSION.error = 'Erro ao iniciar o Firebase — confira se colou a configuração corretamente.';
    render();
  }
}

/* Sobe o Nível automaticamente a cada BATTLES_PER_LEVEL vitórias, preservando o excedente. */
function checkLevelUpFromBattles(t){
  while(t.battlesWon>=BATTLES_PER_LEVEL && t.level<16){
    t.level += 1;
    t.battlesWon -= BATTLES_PER_LEVEL;
    SESSION.notice = t.name+' completou '+BATTLES_PER_LEVEL+' batalhas vencidas e subiu para o Nível '+t.level+'!';
  }
  if(t.level>=16 && t.battlesWon>BATTLES_PER_LEVEL-1) t.battlesWon = BATTLES_PER_LEVEL-1;
}
DT.addBattleWin = function(id){
  var t = findTrainer(id); if(!t) return;
  t.battlesWon = (t.battlesWon||0)+1;
  checkLevelUpFromBattles(t);
  mutate();
};
DT.setBattles = function(id, el){
  var t = findTrainer(id); if(!t) return;
  t.battlesWon = clampInt(el.value,0,99);
  checkLevelUpFromBattles(t);
  mutate();
};

DT.setPip = function(id, attrKey, value){
  var t = findTrainer(id); if(!t) return;
  var current = t.attrPoints[attrKey]||0;
  t.attrPoints[attrKey] = (current===value) ? value-1 : value;
  if(t.attrPoints[attrKey]<0) t.attrPoints[attrKey]=0;
  if(t.attrPoints[attrKey]>5) t.attrPoints[attrKey]=5;
  mutate();
};

DT.rollAttrDie = function(id){
  var t = findTrainer(id); if(!t) return;
  var roll = Math.floor(Math.random()*6)+1;

  SESSION.notice = 'Nível par — 1d6 resultou em ' + roll + ': ' + ATTR_LABELS[attrKey] + '. Aplique manualmente o ponto no atributo (role de novo se ele já estiver em 5).';
  render();
};

function getPoke(tid,pid){
  var t=findTrainer(tid); if(!t) return null;
  for(var i=0;i<t.pokemons.length;i++){ if(t.pokemons[i].id===pid) return t.pokemons[i]; }
  for(var j=0;j<t.banco.length;j++){ if(t.banco[j].id===pid) return t.banco[j]; }
  return null;
}

DT.setPokeField = function(tid,pid,field,el){
  var p = getPoke(tid,pid); if(!p) return;
  p[field] = el.value;
  mutate();
};
DT.applySpecies = function(tid,pid){
  var p = getPoke(tid,pid); if(!p) return;
  var sp = findSpeciesByName(p.especie);
  if(!sp){
    SESSION.error = 'Não encontrei "'+p.especie+'" na Pokédex carregada. Confira a grafia (nome em inglês, como no jogo) ou preencha Tipo/Atributos manualmente.';
    render();
    return;
  }
  p.especie = sp.name;
  p.tipo1 = sp.tipo1;
  p.tipo2 = sp.tipo2 || '';
  p.natural = {
    hp: baseStatToRPG(sp.base.hp),
    atk: baseStatToRPG(sp.base.atk),
    def: baseStatToRPG(sp.base.def),
    spa: baseStatToRPG(sp.base.spa),
    spd: baseStatToRPG(sp.base.spd),
    spe: baseStatToRPG(sp.base.spe)
  };
  SESSION.notice = 'Preenchido com os dados oficiais de '+sp.name+' (#'+sp.num+'): Tipo e Atributos Naturais.';
  mutate();
};
DT.applyMove = function(tid,pid,idx){
  var p = getPoke(tid,pid); if(!p) return;
  var mv = p.moves[idx];
  var found = findMoveByName(mv.nome);
  if(!found){
    SESSION.error = 'Não encontrei o movimento "'+mv.nome+'" na base carregada. Confira a grafia (nome em inglês, como no jogo) ou preencha os campos manualmente.';
    render();
    return;
  }
  p.moves[idx] = {
    nome: found.name, tipo: found.tipo, categoria: found.categoria,
    poder: found.poder===null ? 0 : found.poder,
    precisao: found.precisao, prioridade: found.prioridade,
    efeito: found.efeito + (found.poder===null && found.categoria!=='Status' ? ' (poder/dano variável — veja Cap. 25 das regras)' : '')
  };
  SESSION.notice = 'Preenchido com os dados oficiais de '+found.name+'.';
  mutate();
};

DT.toggleConfuso = function(tid,pid){
  var p = getPoke(tid,pid); if(!p) return;
  p.confuso = !p.confuso;
  mutate();
};
DT.setStage = function(tid,pid,stat,el){
  var p = getPoke(tid,pid); if(!p) return;
  p.estagios[stat] = clampInt(el.value,-6,6);

};
DT.setMove = function(tid,pid,idx,field,el){
  var p = getPoke(tid,pid); if(!p) return;
  var val = el.value;
  if(field==='poder') val = clampInt(val,0,10);
  if(field==='prioridade') val = clampInt(val,-7,7);
  p.moves[idx][field] = val;
  mutate();
};

/* =================== ARRASTAR POKÉMON (Equipe <-> Banco) ===================
   Implementado com Pointer Events (funciona em mouse e touch) em vez do HTML5
   Drag&Drop nativo, que não funciona bem em celular. */
var DRAG = null; /* {tid, area, idx, ghost, pointerId, handleEl, lastTarget} */

function positionGhost(ghost, x, y){
  ghost.style.left = x+'px';
  ghost.style.top = y+'px';
}
function findDropTarget(x, y){
  var el = document.elementFromPoint(x, y);
  if(!el) return null;
  var zone = el.closest('[data-drop-area]');
  if(!zone) return null;
  return { area: zone.getAttribute('data-drop-area'), idx: parseInt(zone.getAttribute('data-drop-idx'),10), el: zone };
}
function cleanupDrag(){
  if(!DRAG) return;
  DRAG.handleEl.removeEventListener('pointermove', DT._dragMove);
  DRAG.handleEl.removeEventListener('pointerup', DT._dragEnd);
  DRAG.handleEl.removeEventListener('pointercancel', DT._dragCancel);
  try{ DRAG.handleEl.releasePointerCapture(DRAG.pointerId); }catch(e){}
  if(DRAG.lastTarget) DRAG.lastTarget.el.classList.remove('drop-hover');
  if(DRAG.ghost && DRAG.ghost.parentNode) DRAG.ghost.parentNode.removeChild(DRAG.ghost);
  DRAG = null;
}
DT.dragStart = function(evt, tid, area, idx){
  if(DRAG) return;
  evt.preventDefault();
  var handle = evt.currentTarget;
  try{ handle.setPointerCapture(evt.pointerId); }catch(e){}
  var t = findTrainer(tid);
  var list = t ? (area==='ativo' ? t.pokemons : t.banco) : [];
  var p = list[idx];
  var ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = (p && (p.apelido || p.especie)) || 'Pokémon';
  document.body.appendChild(ghost);
  positionGhost(ghost, evt.clientX, evt.clientY);
  DRAG = { tid:tid, area:area, idx:idx, ghost:ghost, pointerId:evt.pointerId, handleEl:handle, lastTarget:null };
  handle.addEventListener('pointermove', DT._dragMove);
  handle.addEventListener('pointerup', DT._dragEnd);
  handle.addEventListener('pointercancel', DT._dragCancel);
};
DT._dragMove = function(evt){
  if(!DRAG) return;
  positionGhost(DRAG.ghost, evt.clientX, evt.clientY);
  if(DRAG.lastTarget) DRAG.lastTarget.el.classList.remove('drop-hover');
  var target = findDropTarget(evt.clientX, evt.clientY);
  if(target) target.el.classList.add('drop-hover');
  DRAG.lastTarget = target;
};
DT._dragEnd = function(evt){
  if(!DRAG) return;
  var target = findDropTarget(evt.clientX, evt.clientY);
  var drag = DRAG;
  cleanupDrag();
  if(target) DT.movePokemon(drag.tid, drag.area, drag.idx, target.area, target.idx);
};
DT._dragCancel = function(){ cleanupDrag(); };

/* Regras da troca: soltar num slot vazio move; soltar em cima de um Pokémon
   troca os dois de lugar (o que estava lá vai para onde o arrastado estava).
   Isso vale tanto dentro da mesma área (reordenar) quanto entre Equipe e Banco. */
DT.movePokemon = function(tid, srcArea, srcIdx, dstArea, dstIdx){
  var t = findTrainer(tid); if(!t) return;
  if(srcArea===dstArea && srcIdx===dstIdx) return;
  var srcList = srcArea==='ativo' ? t.pokemons : t.banco;
  if(srcIdx<0 || srcIdx>=srcList.length || !srcList[srcIdx]) return;
  var dstList = dstArea==='ativo' ? t.pokemons : t.banco;
  var moving = srcList[srcIdx];

  if(srcArea===dstArea){
    if(dstIdx<0 || dstIdx>=dstList.length) return; /* só reordena sobre um slot ocupado */
    var tmp = dstList[dstIdx];
    dstList[dstIdx] = moving;
    dstList[srcIdx] = tmp;
    mutate();
    return;
  }

  if(dstIdx<0 || dstIdx>=dstList.length){
    if(dstArea==='ativo' && dstList.length>=6){ SESSION.error='A equipe ativa já está com 6 Pokémon — solte em cima de um deles pra trocar.'; render(); return; }
    srcList.splice(srcIdx,1);
    dstList.push(moving);
    mutate();
    return;
  }

  var other = dstList[dstIdx];
  dstList[dstIdx] = moving;
  srcList[srcIdx] = other;
  mutate();
};

/* ---- Trainer sheet renderer: mode = 'own' | 'gm' | 'readonly' ---- */
function trainerSheetHTML(t, mode){
  var editable = mode==='own' || mode==='gm';
  var out = '';

  /* header row: level + share toggle */
  out += '<div class="grid-2" style="margin-bottom:14px;">';
  out += '<div class="field"><label>Nível do Treinador</label>'+
    (mode==='gm'
      ? '<input type="number" min="1" max="16" value="'+t.level+'" onchange="DT.setLevel(\''+t.id+'\', this)">'
      : '<div class="num" style="font-weight:700;">'+t.level+' / 16'+(mode==='own' ? ' <span class="muted" style="font-weight:400; font-family:\'Roboto\';">(controlado pelo Mestre)</span>' : '')+'</div>')+
    '</div>';
  out += '<div class="field"><label>Compartilhamento</label>'+
    (mode==='own'
      ? '<button class="btn-sm '+(t.shareEnabled?'btn-primary':'')+'" onclick="DT.toggleShare(\''+t.id+'\')">'+(t.shareEnabled?'✓ Visível para a mesa':'Compartilhar com a mesa')+'</button>'
      : shareBadge(t))+
    '</div>';
  out += '</div>';

  /* contador de batalhas vencidas — visível só para o Mestre */
  if(mode==='gm'){
    var bw = t.battlesWon||0;
    out += '<div class="field" style="margin-bottom:14px;"><label>Batalhas vencidas (próximo Nível em '+(BATTLES_PER_LEVEL-bw)+')</label>'+
      '<div class="btn-row" style="align-items:center;">'+
        '<span class="num" style="font-weight:700; font-size:.95rem;">'+bw+' / '+BATTLES_PER_LEVEL+'</span>'+
        '<button class="btn-sm btn-primary" onclick="DT.addBattleWin(\''+t.id+'\')">+1 vitória</button>'+
        '<input type="number" min="0" max="99" value="'+bw+'" onchange="DT.setBattles(\''+t.id+'\', this)" style="width:64px;">'+
      '</div></div>';
  }

  /* attributes */
  var spent = attrSpent(t), budget = attrBudget(t.level);
  out += '<h3 style="font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin-bottom:8px;">Atributos</h3>';
  out += '<div class="attr-grid">';
  ATTR_ORDER.forEach(function(k){
    var val = t.attrPoints[k]||0;
    var pips = '';
    for(var i=1;i<=5;i++){
      pips += editable
        ? '<button type="button" class="pip'+(i<=val?' filled':'')+'" onclick="DT.setPip(\''+t.id+'\',\''+k+'\','+i+')">'+i+'</button>'
        : '<span class="pip'+(i<=val?' filled':'')+'"></span>';
    }
    out += '<div class="attr-row"><span class="label">'+ATTR_LABELS[k]+'</span><span class="pips">'+pips+'</span><span class="val">'+val+'</span></div>';
  });
  out += '</div>';
  out += '<div class="budget'+(spent>budget?' over':'')+'">Pontos usados: '+spent+' / '+budget+(spent>budget?' — acima do esperado para o nível':'')+'</div>';
  if(editable) out += '<div style="margin-top:8px;"><button class="btn-sm" onclick="DT.rollAttrDie(\''+t.id+'\')">🎲 Sortear atributo (nível par)</button></div>';

  /* pokemon roster: 6 slots ativos + Banco (menu deslizante) */
  out += '<hr class="rule" style="margin:18px 0;">';
  out += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">'+
    '<h3 style="font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim);">Equipe ('+t.pokemons.length+'/6)</h3>'+
    (editable ? '<button class="btn-sm" onclick="DT.addPokemon(\''+t.id+'\')">+ Adicionar Pokémon</button>' : '')+
  '</div>';
  if(editable) out += '<p class="muted" style="margin:-4px 0 10px;">Arraste pelo ⠿ pra reorganizar a Equipe ou trocar com o Banco.</p>';

  out += '<div class="poke-grid">';
  for(var slotIdx=0; slotIdx<6; slotIdx++){
    out += pokeSlotHTML(t, t.pokemons[slotIdx]||null, slotIdx, 'ativo', editable, mode);
  }
  out += '</div>';

  var bancoKey = 'banco:'+t.id;
  var bancoOpen = !!SESSION.expanded[bancoKey];
  out += '<div style="margin-top:14px;">'+
    '<button class="btn-sm banco-toggle" onclick="DT.toggleExpand(\''+bancoKey+'\')">'+(bancoOpen?'▲':'▼')+' 🗃️ Banco ('+t.banco.length+')</button>';
  if(bancoOpen){
    out += '<div class="poke-grid banco-drawer" data-drop-area="banco" data-drop-idx="'+t.banco.length+'">';
    if(t.banco.length===0){
      out += '<div class="poke-empty" style="grid-column:1/-1;"><span>Banco vazio.</span>'+(editable?'<span style="font-size:.7rem;">Arraste um Pokémon da Equipe pra cá, ou adicione um novo acima.</span>':'')+'</div>';
    } else {
      t.banco.forEach(function(p, bi){ out += pokeSlotHTML(t, p, bi, 'banco', editable, mode); });
    }
    out += '</div>';
  }
  out += '</div>';

  return out;
}

/* Slot arrastável/soltável: envolve o card (ou um placeholder vazio) com a
   alça de arrastar e os atributos data-drop-* que identificam o alvo. */
function pokeSlotHTML(t, p, idx, area, editable, mode){
  var dropAttrs = ' data-drop-area="'+area+'" data-drop-idx="'+idx+'"';
  if(!p){
    return '<div class="poke-slot poke-slot-empty"'+dropAttrs+'><div class="poke-empty"><span>Slot vazio</span>'+(editable?'<span style="font-size:.7rem;">arraste um Pokémon aqui</span>':'')+'</div></div>';
  }
  var handle = editable ? '<button type="button" class="drag-handle" title="Arrastar para reorganizar" onpointerdown="DT.dragStart(event,\''+t.id+'\',\''+area+'\','+idx+')">⠿</button>' : '';
  return '<div class="poke-slot"'+dropAttrs+'>'+handle+pokeCardHTML(t,p,editable,mode)+'</div>';
}

/* Cores de Tipo padrão da comunidade Pokémon (Bulbapedia/Serebii/veekun). */
var TYPE_COLORS = {
  "Normal":"#A8A878","Fogo":"#F08030","Água":"#6890F0","Grama":"#78C850","Elétrico":"#F8D030",
  "Gelo":"#98D8D8","Lutador":"#C03028","Venenoso":"#A040A0","Terra":"#E0C068","Voador":"#A890F0",
  "Psíquico":"#F85888","Inseto":"#A8B820","Pedra":"#B8A038","Fantasma":"#705898","Dragão":"#7038F8",
  "Sombrio":"#705848","Aço":"#B8B8D0","Fada":"#EE99AC"
};
function readableTextColor(hex){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  var lum = (0.299*r + 0.587*g + 0.114*b);
  return lum > 150 ? '#1a1a1a' : '#fff';
}
function typeBadge(name){
  if(!name) return '';
  var color = TYPE_COLORS[name];
  if(!color) return '<span class="tag">'+esc(name)+'</span>';
  return '<span class="type-badge" style="background:'+color+'; color:'+readableTextColor(color)+';">'+esc(name)+'</span>';
}
function statBarColor(v){
  if(v<6) return '#B32424';
  if(v<10) return '#E08A24';
  if(v<14) return '#D0A72A';
  return '#0B6E4F';
}

function typeTags(p){
  var out='';
  if(p.tipo1) out += typeBadge(p.tipo1)+' ';
  if(p.tipo2) out += typeBadge(p.tipo2);
  return out;
}
function typeDatalist(id){
  return '<datalist id="'+id+'">'+TYPES.map(function(x){ return '<option value="'+x+'">'; }).join('')+'</datalist>';
}
function speciesDatalist(id){
  return '<datalist id="'+id+'">'+SPECIES_DEX.map(function(s){ return '<option value="'+esc(s.name)+'">'; }).join('')+'</datalist>';
}

function pokeCardHTML(t,p,editable,mode){
  var canGM = mode==='gm';
  var expanded = !!SESSION.expanded[p.id];
  var max = hpMax(t,p);
  var cur = (p.currentHP===null || p.currentHP===undefined) ? max : Math.min(p.currentHP,max);
  var pct = max>0 ? Math.round(cur/max*100) : 0;
  var fainted = cur<=0;

  var removeBtn = SESSION.confirmRemovePoke===p.id
    ? '<button class="btn-danger btn-sm" onclick="DT.removePokemon(\''+t.id+'\',\''+p.id+'\')">Confirmar</button><button class="btn-ghost btn-sm" onclick="DT.cancelRemovePokemon()">Cancelar</button>'
    : '<button class="btn-ghost btn-sm" onclick="DT.askRemovePokemon(\''+p.id+'\')">✕</button>';
  var head = '<div class="poke-head">'+
    '<div onclick="DT.toggleExpand(\''+p.id+'\')" style="cursor:pointer; flex:1;">'+
      '<div class="nick">'+(p.apelido?esc(p.apelido):(p.especie?esc(p.especie):'Pokémon sem nome'))+' '+(fainted?'<span class="badge status-bad">Desmaiado</span>':'')+(p.status?'<span class="badge status-bad">'+STATUS_LABELS[p.status]+'</span>':'')+(p.confuso?'<span class="badge status-bad">Confuso</span>':'')+'</div>'+
      '<div class="species">'+(p.especie?esc(p.especie)+' · ':'')+typeTags(p)+'</div>'+
    '</div>'+
    (editable ? removeBtn : '')+
  '</div>';

  var hpBar = '<div class="hp-row">'+
    (editable ? '<input type="number" min="0" max="'+max+'" value="'+cur+'" onchange="DT.setCurrentHP(\''+t.id+'\',\''+p.id+'\', this)">' : '<span class="num">'+cur+'</span>')+
    '<span class="muted">/ '+max+' PV</span>'+
    '<div class="hp-bar'+(pct<=25?' low':'')+'"><i style="width:'+pct+'%"></i></div>'+
    (editable ? '<button class="btn-ghost btn-sm" onclick="DT.healFull(\''+t.id+'\',\''+p.id+'\')">curar</button>' : '')+
  '</div>';

  if(!expanded){
    return '<div class="poke-card">'+head+'<div class="poke-body">'+hpBar+'</div></div>';
  }

  var did = p.id;
  var natField = function(stat){
    return editable
      ? '<input type="number" min="0" max="20" value="'+p.natural[stat]+'" onchange="DT.setPokeNatural(\''+t.id+'\',\''+did+'\',\''+stat+'\', this)" style="width:52px;">'
      : p.natural[stat];
  };

  var statRows = STAT_ORDER.map(function(stat){
    var eff = effectiveStat(t,p,stat);
    var barPct = Math.max(0, Math.min(100, Math.round(eff/20*100)));
    var barColor = statBarColor(eff);
    return '<tr><td>'+STAT_LABELS[stat]+'</td><td class="num">'+natField(stat)+'</td><td class="num eff">'+eff+'</td>'+
      '<td class="stat-bar-cell"><div class="stat-bar-track"><div class="stat-bar-fill" style="width:'+barPct+'%; background:'+barColor+';"></div></div></td></tr>';
  }).join('');

  var statTable = '<div class="table-scroll"><table class="stat-table"><thead><tr><th>Stat</th><th>Natural</th><th>Efetivo</th><th></th></tr></thead><tbody>'+statRows+'</tbody></table></div>';

  var identity = editable ? (
    '<div class="grid-2">'+
      '<div class="field"><label>Apelido</label><input type="text" value="'+esc(p.apelido)+'" onchange="DT.setPokeField(\''+t.id+'\',\''+did+'\',\'apelido\', this)"></div>'+
      '<div class="field"><label>Espécie</label>'+
        '<div class="btn-row">'+
          '<input type="text" list="speciesDexList" placeholder="ex: Charmander" value="'+esc(p.especie)+'" onchange="DT.setPokeField(\''+t.id+'\',\''+did+'\',\'especie\', this)" style="flex:1;">'+
          '<button type="button" class="btn-sm" title="Preenche Tipo e Atributos Naturais com os dados oficiais" onclick="DT.applySpecies(\''+t.id+'\',\''+did+'\')">Dados oficiais</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="field"><label>Tipo 1</label><input type="text" list="typeList" value="'+esc(p.tipo1)+'" onchange="DT.setPokeField(\''+t.id+'\',\''+did+'\',\'tipo1\', this)"></div>'+
      '<div class="field"><label>Tipo 2</label><input type="text" list="typeList" value="'+esc(p.tipo2)+'" onchange="DT.setPokeField(\''+t.id+'\',\''+did+'\',\'tipo2\', this)"></div>'+
    '</div>'
  ) : '';

  var vinculoRow = '<div class="grid-2">'+
    '<div class="field"><label>Vínculo (0–25) — libera '+liberatedTier(p.vinculo)+' pt(s)</label>'+
      (canGM ? '<input type="range" min="0" max="25" value="'+p.vinculo+'" onchange="DT.setVinculo(\''+t.id+'\',\''+did+'\', this)">' : '')+
      '<span class="rangeval num">'+p.vinculo+' / 25'+(mode==='own' ? ' <span class="muted" style="font-size:.68rem;">(controlado pelo Mestre)</span>' : '')+'</span>'+
    '</div>'+
    '<div class="field"><label>Maturidade (regra em aberto)</label>'+
      (editable ? '<input type="number" min="0" value="'+p.maturidade+'" onchange="DT.setMaturidade(\''+t.id+'\',\''+did+'\', this)">' : '<span class="num">'+p.maturidade+'</span>')+
    '</div>'+
  '</div>';

  var statusRow = '<div class="grid-3">'+
    '<div class="field"><label>Condição</label>'+
      (editable
        ? '<select onchange="DT.setStatus(\''+t.id+'\',\''+did+'\', this)">'+STATUS_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===p.status?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>'
        : '<span>'+STATUS_LABELS[p.status]+'</span>')+
    '</div>'+
    ((p.status==='sono'||p.status==='veneno_grave') ? '<div class="field"><label>'+(p.status==='sono'?'Turnos dormindo':'Turno do dano')+'</label>'+
      (editable ? '<input type="number" min="0" max="10" value="'+p.statusTurns+'" onchange="DT.setStatusTurns(\''+t.id+'\',\''+did+'\', this)">' : p.statusTurns)+
    '</div>' : '<div></div>')+
    '<div class="field"><label>Confuso</label>'+
      (editable ? '<button class="btn-sm '+(p.confuso?'btn-primary':'')+'" onclick="DT.toggleConfuso(\''+t.id+'\',\''+did+'\')">'+(p.confuso?'✓ Confuso':'Marcar confuso')+'</button>' : (p.confuso?'Sim':'Não'))+
    '</div>'+
  '</div>';

  var stageFields = STAGE_STATS.concat(['precisao','evasao']);
  var stageLbl = {atk:'Atq',def:'Def',spa:'AEsp',spd:'DEsp',spe:'Vel',precisao:'Prec',evasao:'Evas'};
  var stages = '<div class="field"><label>Estágios (±6)</label><div class="stage-grid">'+
    stageFields.map(function(s){
      return '<div class="stage-field"><label>'+stageLbl[s]+'</label>'+
        (editable ? '<input type="number" min="-6" max="6" value="'+(p.estagios[s]||0)+'" onchange="DT.setStage(\''+t.id+'\',\''+did+'\',\''+s+'\', this)">' : '<div class="num" style="text-align:center;">'+(p.estagios[s]||0)+'</div>')+
      '</div>';
    }).join('')+
  '</div></div>';

  var movesHeader = '<div class="move-labels"><span>Nome</span><span>Tipo</span><span>Categoria</span><span>Poder</span><span>Prior.</span></div>';
  var moves = p.moves.map(function(m, idx){
    if(!editable){
      if(!m.nome) return '';
      var detail = [];
      if(m.precisao) detail.push('precisão '+esc(m.precisao));
      if(m.efeito) detail.push(esc(m.efeito));
      return '<div class="move-row"><span>'+esc(m.nome)+'</span>'+typeBadge(m.tipo)+'<span>'+esc(m.categoria)+'</span><span class="num">'+(m.poder||0)+'</span><span class="num">'+(m.prioridade||0)+'</span></div>'+
        (detail.length ? '<div class="readonly-note">'+detail.join(' · ')+'</div>' : '');
    }
    return '<div class="move-row">'+
      '<input type="text" placeholder="nome" list="movesDexList" value="'+esc(m.nome)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'nome\', this)">'+
      '<input type="text" placeholder="tipo" list="typeList" value="'+esc(m.tipo)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'tipo\', this)">'+
      '<select onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'categoria\', this)">'+CATEGORY_OPTS.map(function(c){ return '<option'+(c===m.categoria?' selected':'')+'>'+c+'</option>'; }).join('')+'</select>'+
      '<input type="number" min="0" max="10" value="'+(m.poder||0)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'poder\', this)">'+
      '<input type="number" min="-7" max="7" value="'+(m.prioridade||0)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'prioridade\', this)">'+
    '</div>'+
    '<div class="move-row move-row2">'+
      '<input type="text" placeholder="precisão (ex: 90%)" value="'+esc(m.precisao)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'precisao\', this)">'+
      '<input type="text" placeholder="efeito (ex: 30% de queimar)" value="'+esc(m.efeito)+'" onchange="DT.setMove(\''+t.id+'\',\''+did+'\','+idx+',\'efeito\', this)">'+
    '</div>'+
    '<div style="text-align:right; margin-bottom:10px;"><button type="button" class="btn-sm" title="Preenche Tipo, Categoria, Poder, Precisão, Prioridade e Efeito com os dados oficiais" onclick="DT.applyMove(\''+t.id+'\',\''+did+'\','+idx+')">Dados oficiais</button></div>';
  }).join('');

  var movesBlock = '<div><label style="font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); display:block; margin-bottom:4px;">Movimentos</label>'+
    (editable ? movesHeader : '')+'<div class="moves-list">'+moves+'</div></div>';

  return '<div class="poke-card">'+head+'<div class="poke-body">'+
    hpBar+
    (editable ? identity : '')+
    statTable+
    vinculoRow+
    statusRow+
    stages+
    movesBlock+
  '</div></div>';
}

/* =================== BOOT =================== */
render(); /* pinta a tela imediatamente (tela de config ou "carregando") */
bootFirebase();

})();
</script>
</body>
</html>
